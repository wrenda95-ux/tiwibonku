<!DOCTYPE html>
<html>
<head>
  <title>Twibbon Online</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

<h2>Upload Foto Kamu</h2>

<input type="file" id="upload"><br><br>

<canvas id="canvas" width="500" height="500" style="border:1px solid #ccc;"></canvas><br><br>

<button id="downloadBtn">Download</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let foto = new Image();
let frame = new Image();

// 🔥 PENTING: ini kunci biar tidak error di online
frame.crossOrigin = "anonymous";
frame.src = "frame.png";

let scale = 1;
let posX = 0;
let posY = 0;

let ready = false;

// upload
document.getElementById("upload").addEventListener("change", function(e){
  const reader = new FileReader();
  reader.onload = function(event){
    foto = new Image();
    foto.onload = function(){
      scale = 1;
      posX = 0;
      posY = 0;
      ready = true;
      draw();
    };
    foto.src = event.target.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});

// draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(ready){
    ctx.drawImage(foto, posX, posY, foto.width * scale, foto.height * scale);
  }

  ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
}

// zoom
canvas.addEventListener("wheel", function(e){
  e.preventDefault();
  scale += (e.deltaY < 0 ? 0.1 : -0.1);
  scale = Math.max(0.2, Math.min(5, scale));
  draw();
});

// drag
let dragging = false, startX, startY;

canvas.addEventListener("mousedown", e=>{
  dragging = true;
  startX = e.offsetX - posX;
  startY = e.offsetY - posY;
});

canvas.addEventListener("mouseup", ()=> dragging = false);
canvas.addEventListener("mousemove", e=>{
  if(dragging){
    posX = e.offsetX - startX;
    posY = e.offsetY - startY;
    draw();
  }
});

// download
document.getElementById("downloadBtn").addEventListener("click", function(){

  if(!ready){
    alert("Upload foto dulu!");
    return;
  }

  const link = document.createElement("a");
  link.download = "twibbon.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

});
</script>

</body>
</html>
