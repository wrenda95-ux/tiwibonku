<!DOCTYPE html>
<html>
<head>
  <title>Twibbon Pro Final</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      text-align:center;
      font-family:sans-serif;
      margin:0;
      padding:10px;
      background:#fafafa;
    }

    canvas{
      border:1px solid #ccc;
      max-width:100%;
      touch-action:none;
      background:#fff;
    }

    .btn{
      padding:12px 14px;
      margin:5px;
      font-size:15px;
      border:none;
      border-radius:8px;
      background:#2196F3;
      color:white;
    }

    .btn:active{
      transform:scale(0.95);
    }

    .btn.gray{
      background:#777;
    }

    .btn.red{
      background:#e53935;
    }
  </style>
</head>

<body>

<h3>Twibbon Pro Final</h3>

<input type="file" id="upload" accept="image/*" capture="environment"><br><br>

<canvas id="canvas" width="500" height="500"></canvas><br>

<!-- CONTROL -->
<button class="btn" onclick="zoomIn()">➕</button>
<button class="btn" onclick="zoomOut()">➖</button>
<button class="btn gray" onclick="centerImage()">🎯 Center</button>
<button class="btn red" onclick="resetAll()">🔄 Reset</button>
<button class="btn" id="downloadBtn">⬇ Download</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let foto = new Image();
let frame = new Image();
frame.src = "frame.png";

let scale = 1;
let posX = 0;
let posY = 0;

let dragging = false;
let startX = 0;
let startY = 0;

let ready = false;

/* ================= UPLOAD ================= */
document.getElementById("upload").addEventListener("change", function(e){
  if(!e.target.files[0]) return;

  const reader = new FileReader();

  reader.onload = function(event){
    foto = new Image();

    foto.onload = function(){

      scale = Math.max(
        canvas.width / foto.width,
        canvas.height / foto.height
      );

      centerImage();

      ready = true;
      draw();
    };

    foto.src = event.target.result;
  };

  reader.readAsDataURL(e.target.files[0]);
});

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(ready){
    ctx.drawImage(foto, posX, posY, foto.width * scale, foto.height * scale);
  }

  ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
}

/* ================= DRAG ================= */
canvas.addEventListener("mousedown", (e)=>{
  dragging = true;
  startX = e.offsetX - posX;
  startY = e.offsetY - posY;
});

canvas.addEventListener("mouseup", ()=> dragging = false);

canvas.addEventListener("mousemove", (e)=>{
  if(dragging){
    posX = e.offsetX - startX;
    posY = e.offsetY - startY;
    draw();
  }
});

/* ================= TOUCH HP ================= */
let lastDist = null;

canvas.addEventListener("touchstart", (e)=>{
  if(e.touches.length === 1){
    dragging = true;
    const t = e.touches[0];
    startX = t.clientX - posX;
    startY = t.clientY - posY;
  }
}, {passive:false});

canvas.addEventListener("touchmove", (e)=>{
  e.preventDefault();

  if(e.touches.length === 1 && dragging){
    const t = e.touches[0];
    posX = t.clientX - startX;
    posY = t.clientY - startY;
    draw();
  }

  if(e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(lastDist){
      const zoom = dist / lastDist;
      scale *= zoom;

      scale = Math.max(0.2, Math.min(6, scale));
      draw();
    }

    lastDist = dist;
  }

}, {passive:false});

canvas.addEventListener("touchend", ()=>{
  dragging = false;
  lastDist = null;
});

/* ================= TOOLS ================= */
function zoomIn(){
  scale += 0.1;
  draw();
}

function zoomOut(){
  scale -= 0.1;
  scale = Math.max(0.2, scale);
  draw();
}

function centerImage(){
  posX = (canvas.width - foto.width * scale) / 2;
  posY = (canvas.height - foto.height * scale) / 2;
  draw();
}

function resetAll(){
  scale = 1;
  posX = 0;
  posY = 0;
  draw();
}

/* ================= DOWNLOAD ================= */
document.getElementById("downloadBtn").addEventListener("click", ()=>{

  if(!ready){
    alert("Upload foto dulu!");
    return;
  }

  const img = canvas.toDataURL("image/png");

  const a = document.createElement("a");
  a.href = img;
  a.download = "Twibbon-Hasil.png";
  a.click();

  alert("File tersimpan di Download / Unduhan HP");
});
</script>

</body>
</html>
