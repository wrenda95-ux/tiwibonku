<!DOCTYPE html>
<html>
<head>
  <title>Twibbon Stabil HP Fix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="text-align:center; font-family:sans-serif;">

<h2>Upload Foto</h2>

<input type="file" id="upload"><br><br>

<canvas id="canvas" width="500" height="500" style="border:1px solid #ccc; touch-action:none;"></canvas><br><br>

<button id="downloadBtn">Download</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let foto = new Image();
let frame = new Image();
frame.src = "frame.png";

let scale = 1;
let posX = 0;
let posY = 0;

let dragging = false;
let startX, startY;

let ready = false;

/* ================= UPLOAD ================= */
document.getElementById("upload").addEventListener("change", function(e){
  const reader = new FileReader();
  reader.onload = function(event){
    foto = new Image();
    foto.onload = function(){
      scale = 1;
      posX = 0;
      posY = 0;
      ready = true;
      draw();
    };
    foto.src = event.target.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});

/* ================= DRAW ================= */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(ready){
    ctx.drawImage(foto, posX, posY, foto.width * scale, foto.height * scale);
  }

  ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
}

/* ================= MOUSE (LAPTOP) ================= */
canvas.addEventListener("mousedown", function(e){
  dragging = true;
  startX = e.offsetX - posX;
  startY = e.offsetY - posY;
});

canvas.addEventListener("mouseup", function(){
  dragging = false;
});

canvas.addEventListener("mousemove", function(e){
  if(dragging){
    posX = e.offsetX - startX;
    posY = e.offsetY - startY;
    draw();
  }
});

/* ================= TOUCH (HP FIX) ================= */
let lastTouchDist = 0;

canvas.addEventListener("touchstart", function(e){
  if(e.touches.length == 1){
    dragging = true;
    let t = e.touches[0];
    startX = t.clientX - posX;
    startY = t.clientY - posY;
  }
}, {passive:false});

canvas.addEventListener("touchmove", function(e){
  e.preventDefault();

  if(e.touches.length == 1 && dragging){
    let t = e.touches[0];
    posX = t.clientX - startX;
    posY = t.clientY - startY;
    draw();
  }

  // PINCH ZOOM (2 jari)
  if(e.touches.length == 2){
    let dx = e.touches[0].clientX - e.touches[1].clientX;
    let dy = e.touches[0].clientY - e.touches[1].clientY;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if(lastTouchDist){
      let zoom = dist / lastTouchDist;
      scale *= zoom;
      scale = Math.max(0.2, Math.min(5, scale));
      draw();
    }
    lastTouchDist = dist;
  }
}, {passive:false});

canvas.addEventListener("touchend", function(){
  dragging = false;
  lastTouchDist = 0;
});

/* ================= WHEEL (ZOOM LAPTOP) ================= */
canvas.addEventListener("wheel", function(e){
  e.preventDefault();

  if(e.deltaY < 0){
    scale += 0.1;
  } else {
    scale -= 0.1;
  }

  scale = Math.max(0.2, Math.min(5, scale));
  draw();
});

/* ================= DOWNLOAD ================= */
document.getElementById("downloadBtn").addEventListener("click", function(){

  if(!ready){
    alert("Upload foto dulu!");
    return;
  }

  const image = canvas.toDataURL("image/png");

  const win = window.open();
  win.document.write("<h3>Klik kanan gambar → Save Image As</h3>");
  win.document.write("<img src='" + image + "' style='width:100%'>");

});
</script>

</body>
</html>
